     SETUP INSTRUCTIONS:
     1. Create a FREE Supabase project at https://supabase.com
     2. Run the SQL below in Supabase SQL Editor
     3. Replace YOUR_PROJECT and YOUR_ANON_KEY with your real values
     4. In _pages/home.md, add this line where you want the map to appear:
           (percent) include visitor-map.html (percent)

     SQL:
       create table visitor_locations (
         id bigint generated always as identity primary key,
         country text, city text, lat float, lng float,
         visited_at timestamptz default now()
       );
       alter table visitor_locations enable row level security;
       create policy "Allow anonymous insert"
         on visitor_locations for insert to anon with check (true);
       create policy "Allow anonymous select"
         on visitor_locations for select to anon using (true);
     ===================================================== -->

<style>
  #visitor-map-section {
    margin: 48px 0 32px;
    font-family: inherit;
  }
  #visitor-map-section h3 {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 4px;
    color: #333;
  }
  #visitor-map-section .map-subtitle {
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 16px;
  }
  #map-container {
    position: relative;
    background: #f0f4f8;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #e2e8f0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  #map-container svg {
    display: block;
    width: 100%;
    height: auto;
  }
  .country-base {
    fill: #d4dde8;
    stroke: #fff;
    stroke-width: 0.5px;
  }
  .visitor-dot-ring {
    fill: none;
    stroke: #ef4444;
    stroke-width: 1px;
    opacity: 0.3;
  }
  .recent-halo {
    fill: none;
    stroke: #dc2626;
    stroke-width: 1.4px;

  }
  #map-tooltip {
    position: absolute;
    background: rgba(15,23,42,0.88);
    color: #f1f5f9;
    font-size: 0.75rem;
    padding: 6px 10px;
    border-radius: 6px;
    pointer-events: none;
    display: none;
    white-space: nowrap;
    z-index: 10;
  }
  #map-loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0f4f8;
    font-size: 0.85rem;
    color: #94a3b8;
    z-index: 5;
    border-radius: 12px;
  }
  .map-spinner {
    width: 20px;
    height: 20px;
    border: 2px solid #cbd5e1;
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .you-are-here {
    fill: #f97316;
    stroke: #fff;
    stroke-width: 2px;
    animation: pulse-dot 2s ease-out infinite;
  }
  @keyframes pulse-dot {
    0%   { r: 5px; opacity: 1; }
    70%  { r: 9px; opacity: 0.3; }
    100% { r: 5px; opacity: 1; }
  }
  .recent-halo {
    animation: halo-pulse 2.4s ease-out infinite;
  }
  @keyframes halo-pulse {
    0%   { opacity: 0.55; }
    70%  { opacity: 0.12; }
    100% { opacity: 0.55; }
  }
  #map-legend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    margin-top: 12px;
    font-size: 0.75rem;
    color: #94a3b8;
  }
  #map-legend .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  #map-legend .legend-swatch {
    display: inline-block;
    border-radius: 50%;
    border: 1.5px solid #fff;
  }
</style>

<div id="visitor-map-section">
  <h3>&#127758; Visitor Footprints</h3>
  <p class="map-subtitle">
    <span id="visitor-count">...</span> visitors from around the world
  </p>
  <div id="map-container" style="min-height:260px">
    <div id="map-loading">
      <div class="map-spinner"></div> Loading visitor map&hellip;
    </div>
    <div id="map-tooltip"></div>
  </div>
  <div id="map-legend" aria-hidden="true">
    <span class="legend-item">
      <span class="legend-swatch" style="width:12px;height:12px;background:#ef4444"></span>
      Recent visitors
    </span>
    <span class="legend-item">
      <span class="legend-swatch" style="width:7px;height:7px;background:#fca5a5;opacity:0.6"></span>
      Earlier visitors
    </span>
    <span class="legend-item">
      <span class="legend-swatch" style="width:11px;height:11px;background:#f97316"></span>
      You
    </span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>

<script>
(function () {

  // ── CONFIGURATION: replace these two values ──────────────────────────────
  var SUPABASE_URL      = 'https://yocgiwmzqbqjnfixjfyt.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvY2dpd216cWJxam5maXhqZnl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzMTI5OTIsImV4cCI6MjA4ODg4ODk5Mn0.uzoZYPLkN-OQ9Z_RhY3D4Lt2tpq9UwyYirFmlZ08q_U';
  // ─────────────────────────────────────────────────────────────────────────

  var AUTH_HEADERS = {
    'apikey':        SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type':  'application/json'
  };

  var PAGE_SIZE = 1000;          // PostgREST's default max rows per response
  var MAX_PAGES = 50;            // hard safety cap: up to 50k dots

  // Step 1: load ALL existing visitor records via Range-header pagination,
  // then continue.
  // - Supabase/PostgREST caps a single response at 1000 rows. To show
  //   every visitor (not just the most recent 1000) we page through with
  //   the `Range: <from>-<to>` header until we've pulled the whole table.
  // - cache: 'no-store' bypasses the browser HTTP cache.
  // - Prefer: count=exact makes PostgREST report the true total row count
  //   in the Content-Range header (`<from>-<to>/<total>`), so we know both
  //   the grand total and when to stop paging.
  // - visited_at is selected so each dot can be styled by recency.
  // - order=visited_at.desc so page 0 holds the newest visitors; we render
  //   oldest-first later so recent dots paint on top.
  function fetchPage(from) {
    var to = from + PAGE_SIZE - 1;
    return fetch(SUPABASE_URL + '/rest/v1/visitor_locations?select=country,city,lat,lng,visited_at&order=visited_at.desc',
          {
            headers: {
              'apikey':        SUPABASE_ANON_KEY,
              'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
              'Content-Type':  'application/json',
              'Prefer':        'count=exact',
              'Range-Unit':    'items',
              'Range':         from + '-' + to
            },
            cache: 'no-store'
          })
      .then(function (r) {
        if (!r.ok && r.status !== 206) {
          console.warn('[visitor-map] read failed:', r.status, r.statusText);
          return { total: 0, rows: [] };
        }
        var range = r.headers.get('content-range') || '*/0';
        var total = parseInt(range.split('/')[1], 10) || 0;
        return r.json().then(function (rows) {
          return { total: total, rows: Array.isArray(rows) ? rows : [] };
        });
      });
  }

  function loadAll() {
    var all = [];
    function next(from, page) {
      return fetchPage(from).then(function (res) {
        all = all.concat(res.rows);
        var more = res.rows.length === PAGE_SIZE &&
                   all.length < res.total &&
                   page + 1 < MAX_PAGES;
        if (more) {
          return next(from + PAGE_SIZE, page + 1);
        }
        return { total: res.total || all.length, visitors: all };
      });
    }
    return next(0, 0);
  }

  loadAll()
    .catch(function (e) {
      console.warn('[visitor-map] read network error:', e);
      return { total: 0, visitors: [] };
    })
    .then(function (result) {
      var visitors = Array.isArray(result.visitors) ? result.visitors : [];
      geolocateAndRender(visitors, result.total || visitors.length);
    });


  function geolocateAndRender(visitors, totalCount) {

    // Always render the count first using just the historical data,
    // so Safari/ITP blocking the ipapi geolocation call doesn't leave
    // the count stuck on the "..." placeholder. Use the exact row
    // total from PostgREST's Content-Range header, not visitors.length
    // — that array tops out at the default page size (1000 rows).
    document.getElementById('visitor-count').textContent =
      totalCount.toLocaleString();

    // Step 2: detect current visitor location via IP
    fetch('https://ipapi.co/json/', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) {
          console.warn('[visitor-map] geo lookup failed:', r.status);
          return null;
        }
        return r.json();
      })
      .catch(function (e)  {
        console.warn('[visitor-map] geo network error:', e);
        return null;
      })
      .then(function (geo) {

        var me = null;

        if (geo && geo.latitude && geo.longitude) {
          me = {
            lat:     geo.latitude,
            lng:     geo.longitude,
            country: geo.country_name,
            city:    geo.city
          };

          // Record this visit (fire-and-forget). Surface non-2xx
          // responses to the console so a silent RLS / auth failure
          // is debuggable instead of looking like the count is stuck.
          fetch(SUPABASE_URL + '/rest/v1/visitor_locations', {
            method:  'POST',
            cache:   'no-store',
            headers: {
              'apikey':        SUPABASE_ANON_KEY,
              'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
              'Content-Type':  'application/json',
              'Prefer':        'return=minimal'
            },
            body: JSON.stringify(me)
          })
          .then(function (r) {
            if (!r.ok) {
              console.warn('[visitor-map] insert failed:', r.status, r.statusText);
            }
          })
          .catch(function (e) {
            console.warn('[visitor-map] insert network error:', e);
          });
        }

        // Refresh the counter once we know whether the current view
        // is being recorded too. Add 1 for "me" so the current visitor
        // is reflected before the POST round-trips into the next read.
        document.getElementById('visitor-count').textContent =
          (totalCount + (me ? 1 : 0)).toLocaleString();

        drawMap(visitors, me);
      });
  }


  function drawMap(visitors, me) {

    var container = document.getElementById('map-container');
    var W = container.clientWidth || 800;
    var H = Math.round(W * 0.52);

    var svg = d3.select('#map-container')
      .append('svg')
      .attr('viewBox', '0 0 ' + W + ' ' + H)
      .attr('preserveAspectRatio', 'xMidYMid meet');

    var projection = d3.geoNaturalEarth1()
      .scale(W / 6.2)
      .translate([W / 2, H / 2]);

    var pathGen = d3.geoPath().projection(projection);

    // Graticule grid lines
    svg.append('path')
      .datum(d3.geoGraticule()())
      .attr('fill', 'none')
      .attr('stroke', '#c8d5e2')
      .attr('stroke-width', 0.3)
      .attr('d', pathGen);

    // Fetch and draw world map
    d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(function (world) {

        var features = topojson.feature(world, world.objects.countries).features;

        svg.selectAll('.land')
          .data(features)
          .join('path')
          .attr('class', 'country-base')
          .attr('d', pathGen);

        // Globe outline
        svg.append('path')
          .datum({ type: 'Sphere' })
          .attr('fill', 'none')
          .attr('stroke', '#b0c0d0')
          .attr('stroke-width', 0.8)
          .attr('d', pathGen);

        var tooltip = document.getElementById('map-tooltip');

        var now = Date.now();

        // Age of a visit in days; Infinity if the timestamp is missing
        // or unparseable, so such rows fall into the faintest tier.
        function ageDays(v) {
          if (!v || !v.visited_at) return Infinity;
          var t = Date.parse(v.visited_at);
          if (isNaN(t)) return Infinity;
          return (now - t) / 86400000;
        }

        // Human-readable recency for the tooltip.
        function relTime(d) {
          if (!isFinite(d)) return '';
          if (d < 1 / 24)  return 'just now';
          if (d < 1)       return Math.max(1, Math.round(d * 24)) + 'h ago';
          if (d < 30)      return Math.round(d) + 'd ago';
          if (d < 365)     return Math.round(d / 30) + 'mo ago';
          return Math.round(d / 365) + 'y ago';
        }

        // Map age → dot size / colour / opacity. Newer visits render
        // larger, more saturated, and more opaque; older ones fade back.
        function styleFor(d) {
          if (d <= 2)  return { r: 5,   fill: '#ef4444', op: 0.95 };
          if (d <= 7)  return { r: 4.3, fill: '#f43f5e', op: 0.85 };
          if (d <= 30) return { r: 3.6, fill: '#fb7185', op: 0.70 };
          if (d <= 90) return { r: 3,   fill: '#fca5a5', op: 0.55 };
          return           { r: 2.6, fill: '#fecaca', op: 0.42 };
        }

        // Helper to add one visitor dot. `opts` carries the recency
        // style, a relative-time label, and whether to draw a halo.
        function addDot(lat, lng, city, country, isMe, opts) {
          var xy = projection([lng, lat]);
          if (!xy) return;
          var x = xy[0];
          var y = xy[1];
          opts = opts || {};

          if (isMe) {
            svg.append('circle')
              .attr('class', 'visitor-dot-ring')
              .attr('cx', x).attr('cy', y)
              .attr('r', 10);
          } else if (opts.halo) {
            // Pulsing halo marks the most recent arrivals.
            svg.append('circle')
              .attr('class', 'recent-halo')
              .attr('cx', x).attr('cy', y)
              .attr('r', (opts.style ? opts.style.r : 5) + 5);
          }

          var dot = svg.append('circle')
            .attr('cx', x).attr('cy', y)
            .style('pointer-events', 'all')
            .style('cursor', 'pointer');

          if (isMe) {
            dot.attr('r', 5).attr('class', 'you-are-here');
          } else {
            var s = opts.style || styleFor(Infinity);
            dot.attr('r', s.r)
              .attr('fill', s.fill)
              .attr('stroke', '#fff')
              .attr('stroke-width', 1.2)
              .attr('opacity', s.op);
          }

          dot.on('mousemove', function (event) {
              var place = city ? city + ', ' + country : country;
              var label;
              if (isMe) {
                label = '&#128205; You: ' + place;
              } else {
                label = '&#128100; ' + place;
                if (opts.rel) label += ' &middot; ' + opts.rel;
              }
              tooltip.innerHTML  = label;
              tooltip.style.display = 'block';
              var rect = container.getBoundingClientRect();
              tooltip.style.left = (event.clientX - rect.left + 12) + 'px';
              tooltip.style.top  = (event.clientY - rect.top  - 28) + 'px';
            })
            .on('mouseleave', function () {
              tooltip.style.display = 'none';
            });
        }

        // visitors is ordered newest-first. Halo the most recent few,
        // then draw oldest-first so recent dots paint on top.
        var RECENT_HALO = 6;
        var drawable = visitors.filter(function (v) { return v.lat && v.lng; });

        drawable.forEach(function (v, i) {
          v.__halo  = i < RECENT_HALO;
          v.__style = styleFor(ageDays(v));
          v.__rel   = relTime(ageDays(v));
        });

        for (var i = drawable.length - 1; i >= 0; i--) {
          var v = drawable[i];
          addDot(v.lat, v.lng, v.city, v.country, false,
                 { halo: v.__halo, style: v.__style, rel: v.__rel });
        }

        // Draw current visitor on top
        if (me) {
          addDot(me.lat, me.lng, me.city, me.country, true, {});
        }

        document.getElementById('map-loading').remove();
      })
      .catch(function () {
        document.getElementById('map-loading').textContent = 'Map unavailable.';
      });
  }

}());
</script>
