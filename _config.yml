# Site settings
title: Wenxiang Jiao
email: wenxiangjiaonju@gmail.com
description: >
  Wenxiang Jiao studies capability learning, deep reasoning, and self-evolving
  agents, with a focus on tool and skill learning, Agentic RL, and Harness Engineering.
baseurl: ""
url: "https://wxjiao.github.io"

include:
  - .htaccess
  - _pages

# Local reference documents and development files are not public site assets.
exclude:
  - CV_wxjiao_1104.pdf
  - CLAUDE.md
  - README.md
  - test

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

